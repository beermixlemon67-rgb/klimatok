<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#e8f1f8">
    <title>Climat OK — Кошторис</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #e8f1f8; 
            margin: 0; 
            padding: 6px 8px calc(88px + env(safe-area-inset-bottom)) 8px; 
            color: #0f172a; 
        }
        
        /* Закріплений перемикач вкладок */
        .tabs-sticky {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(232, 241, 248, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 2px 0 8px 0;
        }
        .tabs { 
            display: flex; 
            background: #cfe2f3; 
            border-radius: 12px; 
            padding: 3px; 
        }
        .tab-btn { 
            flex: 1; 
            padding: 9px 6px; 
            text-align: center; 
            font-family: inherit;
            font-size: 12.5px; 
            font-weight: 800; 
            color: #334e68; 
            border-radius: 9px; 
            border: none; 
            background: transparent; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            text-transform: uppercase; 
            letter-spacing: 0.3px;
        }
        .tab-btn.active { 
            background: #ffffff; 
            color: #0284c7; 
            box-shadow: 0 2px 6px rgba(12, 60, 96, 0.12); 
        }
        
        /* Зовнішня обгортка для скріншоту чека (компактна) */
        #receipt-wrapper { 
            background: #e8f1f8; 
            padding: 6px; 
            border-radius: 20px; 
            max-width: 480px;
            margin: 0 auto;
        }

        /* Біла картка чека з компактними відступами */
        .container { 
            background: #ffffff; 
            border-radius: 18px; 
            padding: 10px 10px; 
            box-shadow: 0 6px 20px rgba(12, 60, 96, 0.08);
        }
        
        /* Компактна шапка Climat OK */
        .receipt-header {
            background: #0c3c60;
            border-radius: 14px;
            padding: 11px 12px 10px 12px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        
        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        .brand-identity {
            display: flex;
            flex-direction: column;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.4px;
            line-height: 1;
            color: #ffffff;
        }
        .brand-ok {
            background: #00b4d8;
            color: #07192b;
            font-size: 13px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 5px;
            letter-spacing: 0.5px;
        }
        .brand-sub {
            font-size: 9.5px;
            color: #bae6fd;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .meta-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }
        .receipt-date {
            font-size: 11.5px;
            font-weight: 800;
            background: #1e5680;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 8px;
            font-variant-numeric: tabular-nums;
        }
        .brand-region {
            font-size: 10px;
            color: #e0f2fe;
            font-weight: 700;
        }

        .brand-pillars {
            display: flex;
            gap: 12px;
            font-size: 9.5px;
            font-weight: 800;
            color: #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 6px 0;
            margin-bottom: 8px;
            border-top: 1px solid #1e5680;
            border-bottom: 1px solid #1e5680;
        }

        .stage-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .receipt-title { 
            font-size: 15px; 
            font-weight: 800;
            margin: 0; 
            letter-spacing: 0.1px; 
            color: #ffffff;
        }
        .stage-badge {
            font-size: 9.5px;
            font-weight: 800;
            text-transform: uppercase;
            background: #0284c7;
            color: #e0f2fe;
            padding: 4px 8px;
            border-radius: 7px;
            letter-spacing: 0.4px;
            flex-shrink: 0;
        }
        
        /* Компактна шапка таблиці */
        .table-header { 
            display: flex; 
            align-items: center;
            gap: 6px; 
            padding: 0 4px 6px 4px; 
            border-bottom: 2px solid #e2e8f0; 
            margin-bottom: 4px; 
            font-size: 10px; 
            font-weight: 800; 
            color: #64748b; 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 0.4px;
        }
        .th-name { flex: 1; text-align: left; padding-left: 2px; }
        .th-price { width: 62px; }
        .th-qty { width: 48px; }
        .th-total { width: 66px; text-align: right; padding-right: 2px; }
        
        /* Рядки позицій з мінімальними відступами */
        .item { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            padding: 4px 5px; 
            margin: 2px 0;
            border-radius: 9px;
            border: 1.5px solid transparent;
            border-bottom-color: #f8fafc; 
        }
        .item:last-of-type { border-bottom-color: transparent; }
        
        /* Активний рядок */
        .item.active-row {
            background: #e0f2fe;
            border: 1.5px solid #7dd3fc;
        }
        
        /* Назва роботи */
        .name { 
            flex: 1; 
            font-weight: 600; 
            font-size: 13px; 
            line-height: 1.2; 
            color: #1e293b;
            word-break: break-word; 
            margin: 0; 
            padding: 2px 3px; 
            border: 1px solid transparent; 
            border-radius: 5px; 
        }
        .item.active-row .name {
            color: #0c4a6e;
            font-weight: 800;
        }
        .name[contenteditable="true"]:focus { 
            outline: none;
            border-color: #0284c7; 
            background: #ffffff; 
        }
        
        /* Поля вводу (зменшена висота до 33px для економії простору) */
        input[type="number"] { 
            height: 33px;
            padding: 2px 2px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 7px; 
            font-family: inherit;
            font-size: 15.5px; 
            font-weight: 800; 
            font-variant-numeric: tabular-nums;
            text-align: center; 
            background: #f8fafc; 
            color: #334155; 
            margin: 0;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input:focus { 
            outline: none; 
            border-color: #0284c7; 
            background: #ffffff; 
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }
        .price-input { width: 62px; }
        .qty-input { width: 48px; }
        .qty-input.filled {
            background: #0284c7;
            border-color: #0369a1;
            color: #ffffff;
        }
        .qty-input.filled:focus {
            background: #ffffff;
            color: #0f172a;
            border-color: #0284c7;
        }
        input::placeholder { color: #cbd5e1; font-weight: 700; }
        
        /* Сума по позиції */
        .item-total { 
            width: 66px; 
            font-weight: 800; 
            font-size: 14px; 
            font-variant-numeric: tabular-nums;
            text-align: right; 
            white-space: nowrap; 
            padding-right: 2px;
            color: #94a3b8;
        }
        .item.active-row .item-total {
            color: #0369a1;
            font-weight: 900;
        }

        /* Розділювач */
        .receipt-divider {
            margin: 8px 2px;
            border-top: 2px dashed #cbd5e1;
        }
        
        /* Зелений блок загальної суми */
        .stage-total { 
            background: #059669; 
            color: #ffffff; 
            padding: 11px 14px; 
            border-radius: 12px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-label {
            font-size: 12.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .total-amount {
            font-size: 20px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.2px;
        }
        
        /* Гарантійний блок знизу */
        .footer-note { 
            font-size: 11.5px; 
            color: #334155; 
            text-align: left; 
            margin-top: 8px; 
            font-weight: 600; 
            line-height: 1.35; 
            padding: 8px 10px; 
            background: #f0f9ff;
            border-radius: 9px;
            border: 1.5px solid #bae6fd;
        }

        /* Нижня візитка компанії на чеку */
        .company-footer {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1.5px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: 800;
        }
        .company-contact {
            color: #0c4a6e;
        }
        .company-site {
            color: #0284c7;
            font-weight: 900;
        }

        /* Нижня фіксована панель кнопок */
        .actions { 
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid #cbd5e1;
            display: flex; 
            gap: 10px; 
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom)) 12px;
            z-index: 100;
        }
        .btn { 
            min-height: 46px;
            padding: 10px 14px; 
            border: none; 
            border-radius: 12px; 
            font-family: inherit;
            color: white; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: transform 0.1s ease, opacity 0.1s ease;
        }
        .btn:active { opacity: 0.9; transform: scale(0.97); }
        .btn-text { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .btn-send { 
            background: #0284c7; 
            flex: 1.8; 
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.28);
        } 
        .btn-red { 
            background: #dc2626; 
            flex: 1; 
            box-shadow: 0 3px 10px rgba(220, 38, 38, 0.22);
        }

        /* Адаптація під дуже вузькі екрани */
        @media (max-width: 360px) {
            #receipt-wrapper { padding: 4px; }
            .container { padding: 8px 8px; }
            .price-input, .th-price { width: 55px; }
            .qty-input, .th-qty { width: 44px; }
            .item-total, .th-total { width: 56px; font-size: 13px; }
            .name { font-size: 12px; }
            input[type="number"] { font-size: 14.5px; height: 31px; }
            .total-amount { font-size: 18px; }
            .brand-logo { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="tabs-sticky">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)" id="tab-0">1. Перший етап</button>
        <button class="tab-btn" onclick="switchTab(1)" id="tab-1">2. Другий етап</button>
    </div>
</div>

<div id="receipt-wrapper">
    <div id="receipt-content" class="container"></div>
</div>

<div class="actions">
    <button class="btn btn-send" onclick="sendImage()">
        <div class="btn-text" id="text-send">Надіслати чек</div>
    </button>
    
    <button class="btn btn-red" onclick="clearAll()">
        <div class="btn-text">Очистити</div>
    </button>
</div>

<script>
    let currentTab = 0;

    const defaultData = [
        {
            stage: "1 Етап монтажних робіт",
            items: [
                { name: "Монтаж фреонової магістралі", price: 2500, qty: 0 },
                { name: "Фреонова магістраль 1/4 і 3/8", price: 800, qty: 0 },
                { name: "Фреонова магістраль 1/4 і 5/8 (3/8 і 5/8)", price: 1100, qty: 0 },
                { name: "Сифон HL138", price: 1700, qty: 0 },
                { name: "Монтаж сифона з розхідниками", price: 800, qty: 0 },
                { name: "Штроба шириною до 5 см за м/п", price: 200, qty: 0 },
                { name: "Дренажна труба ПВХ з прокладанням", price: 120, qty: 0 },
                { name: "Алмазне буріння отвору 52 мм", price: 200, qty: 0 },
                { name: "Кабель 3х2,5 та його прокладання", price: 80, qty: 0 },
                { name: "Злив з зовнішнього блоку", price: 800, qty: 0 }
            ]
        },
        {
            stage: "2 Етап монтажних робіт",
            items: [
                { name: "Монтаж внутр. блоку [7, 9, 12]", price: 1500, qty: 0 },
                { name: "Монтаж внутр. блоку [18, 24]", price: 2000, qty: 0 },
                { name: "Монтаж зовн. блоку [7, 9, 12]", price: 2000, qty: 0 },
                { name: "Монтаж зовн. блоку [18, 24]", price: 2500, qty: 0 },
                { name: "Монтаж корзини", price: 1300, qty: 0 },
                { name: "Послуги альпініста", price: 3000, qty: 0 }
            ]
        }
    ];

    let data = JSON.parse(localStorage.getItem('climatok_koshtorys_v5')) || JSON.parse(JSON.stringify(defaultData));

    function saveData() {
        localStorage.setItem('climatok_koshtorys_v5', JSON.stringify(data));
    }

    function formatMoney(num) {
        let val = Math.round(num * 100) / 100;
        return val.toLocaleString('uk-UA');
    }

    function getTodayDate() {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}.${month}.${year}`;
    }

    function switchTab(index) {
        currentTab = index;
        document.getElementById('tab-0').classList.toggle('active', index === 0);
        document.getElementById('tab-1').classList.toggle('active', index === 1);
        render();
    }

    function render() {
        let stage = data[currentTab];
        let stageTotal = 0;
        
        let html = `
            <div class="receipt-header">
                <div class="brand-row">
                    <div class="brand-identity">
                        <div class="brand-logo">
                            <span>CLIMAT</span>
                            <span class="brand-ok">OK</span>
                        </div>
                        <div class="brand-sub">Кондиціонери та вентиляція</div>
                    </div>
                    <div class="meta-col">
                        <span class="receipt-date">${getTodayDate()}</span>
                        <span class="brand-region">м. Львів та область</span>
                    </div>
                </div>
                <div class="brand-pillars">
                    <span>● Якісно</span>
                    <span>● Швидко</span>
                    <span>● Професійно</span>
                </div>
                <div class="stage-banner">
                    <h2 class="receipt-title">${stage.stage}</h2>
                    <span class="stage-badge">Кошторис</span>
                </div>
            </div>
            <div class="table-header">
                <div class="th-name">Робота / Матеріали</div>
                <div class="th-price">Ціна</div>
                <div class="th-qty">К-сть</div>
                <div class="th-total">Сума</div>
            </div>`;
        
        stage.items.forEach((item, iIndex) => {
            let rawTotal = Math.round((item.price * item.qty) * 100) / 100;
            stageTotal += rawTotal;
            
            let displayQty = item.qty === 0 ? '' : item.qty;
            let activeRowClass = item.qty > 0 ? 'active-row' : '';
            let filledQtyClass = item.qty > 0 ? 'filled' : '';
            
            html += `<div class="item ${activeRowClass}" id="row-${iIndex}">
                        <div class="name" contenteditable="true" onblur="updateName(${currentTab}, ${iIndex}, this.innerText)">${item.name}</div>
                        <input type="number" class="price-input" inputmode="decimal" step="any" value="${item.price}" onfocus="this.select()" oninput="liveUpdate(${currentTab}, ${iIndex}, 'price', this.value)">
                        <input type="number" class="qty-input ${filledQtyClass}" id="qty-${iIndex}" inputmode="decimal" step="any" placeholder="0" value="${displayQty}" onfocus="this.select()" oninput="liveUpdate(${currentTab}, ${iIndex}, 'qty', this.value)">
                        <div class="item-total" id="total-${iIndex}">${formatMoney(rawTotal)}</div>
                     </div>`;
        });
        
        html += `<div class="receipt-divider"></div>`;
        html += `<div class="stage-total">
                    <span class="total-label">Разом до сплати:</span>
                    <span class="total-amount" id="stage-total-box">${formatMoney(stageTotal)} ₴</span>
                 </div>`;
        html += `<div class="footer-note">
                    Встановлюємо обладнання лише з нашого асортименту та надаємо офіційну гарантію на нього
                 </div>`;
        html += `<div class="company-footer">
                    <span class="company-contact">Тел: 063 826 86 22 (Олег)</span>
                    <span class="company-site">climatok.com.ua</span>
                 </div>`;
        
        document.getElementById('receipt-content').innerHTML = html;
    }

    function updateName(sIndex, iIndex, value) {
        data[sIndex].items[iIndex].name = value.trim();
        saveData();
    }

    function liveUpdate(sIndex, iIndex, field, value) {
        let val = String(value).replace(',', '.');
        let num = parseFloat(val);
        if (isNaN(num) || num < 0) num = 0;

        data[sIndex].items[iIndex][field] = num;
        saveData();

        let item = data[sIndex].items[iIndex];
        let rowTotal = Math.round((item.price * item.qty) * 100) / 100;
        
        let totalEl = document.getElementById(`total-${iIndex}`);
        if (totalEl) totalEl.innerText = formatMoney(rowTotal);

        let rowEl = document.getElementById(`row-${iIndex}`);
        let qtyEl = document.getElementById(`qty-${iIndex}`);
        if (rowEl && qtyEl) {
            rowEl.classList.toggle('active-row', item.qty > 0);
            qtyEl.classList.toggle('filled', item.qty > 0);
        }

        let stageTotal = 0;
        data[sIndex].items.forEach(it => {
            stageTotal += Math.round((it.price * it.qty) * 100) / 100;
        });

        let stageTotalBox = document.getElementById('stage-total-box');
        if (stageTotalBox) {
            stageTotalBox.innerText = `${formatMoney(stageTotal)} ₴`;
        }
    }
    
    function clearAll() { 
        if(confirm('Очистити всі кількості в обох етапах?')) { 
            data.forEach(s => s.items.forEach(i => i.qty = 0)); 
            saveData();
            render(); 
        } 
    }

    function sendImage() {
        if (document.activeElement) {
            document.activeElement.blur();
        }

        const text = document.getElementById('text-send');
        text.innerHTML = 'ГОТУЮ ЧЕК...';
        
        const content = document.getElementById('receipt-wrapper');
        
        setTimeout(() => {
            html2canvas(content, { 
                scale: 3, 
                backgroundColor: "#e8f1f8",
                useCORS: true,
                scrollY: -window.scrollY
            }).then(canvas => {
                canvas.toBlob(blob => {
                    let fileName = currentTab === 0 ? "ClimatOK_1_Etap.png" : "ClimatOK_2_Etap.png";
                    const file = new File([blob], fileName, { type: "image/png" });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: `Climat OK - ${data[currentTab].stage}` })
                        .then(() => { text.innerHTML = 'УСПІШНО НАДІСЛАНО'; })
                        .catch(() => { text.innerHTML = 'НАДІСЛАТИ ЧЕК'; })
                        .finally(() => { setTimeout(() => { text.innerHTML = 'НАДІСЛАТИ ЧЕК'; }, 2000); });
                    } else { 
                        let link = document.createElement('a');
                        link.download = fileName;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        text.innerHTML = 'ЗБЕРЕЖЕНО';
                        setTimeout(() => { text.innerHTML = 'НАДідСЛАТИ ЧЕК'; }, 2000);
                    }
                });
            });
        }, 150);
    }
    
    render();
</script>
</body>
</html>
